<text x="480" y="274" text-anchor="middle" class="s">run 2: lidar first, then IMU</text>
<line x1="20" y1="310" x2="940" y2="310" stroke="#d4d9df" stroke-width="2"/>
<text x="20" y="352" class="b">Copper: an assembly line</text>
<text x="20" y="378" class="m">every task works on the same tray, in the same order, every cycle</text>

