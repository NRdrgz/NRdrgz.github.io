<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-label="A vision-language-action model: camera images, a language instruction and the robot state go through a pre-trained vision-language model and an action expert that outputs actions">
<title>A vision-language-action model: camera images, a language instruction and the robot state go through a pre-trained vision-language model and an action expert that outputs actions</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
  </marker>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 19px; fill: #2E2E2E; }
    .b { font-weight: 600; }
    .m { fill: #5b6470; font-size: 16px; }
    .s { font-size: 15px; fill: #5b6470; }
    .arrow { stroke: #5b6470; stroke-width: 2; fill: none; marker-end: url(#arr); }
  </style>
</defs>
<rect width="940" height="460" fill="#ffffff"/>

<rect x="20" y="30" width="230" height="70" rx="10" fill="#f6f8fa" stroke="#d4d9df" stroke-width="2"/>
<text x="135.0" y="59.5" text-anchor="middle" class="b">Vision</text>
<text x="135.0" y="82.5" text-anchor="middle" class="m">camera images</text>
<rect x="20" y="130" width="230" height="80" rx="10" fill="#f6f8fa" stroke="#d4d9df" stroke-width="2"/>
<text x="135.0" y="153.0" text-anchor="middle" class="b">Language</text>
<text x="135.0" y="176.0" text-anchor="middle" class="m">“open the electrical</text>
<text x="135.0" y="199.0" text-anchor="middle" class="m">cabinet”</text>
<rect x="20" y="240" width="230" height="70" rx="10" fill="#f6f8fa" stroke="#d4d9df" stroke-width="2"/>
<text x="135.0" y="269.5" text-anchor="middle" class="b">State</text>
<text x="135.0" y="292.5" text-anchor="middle" class="m">joint positions</text>
<rect x="310" y="20" width="330" height="300" rx="14" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<text x="475" y="62" text-anchor="middle" class="b">Pre-trained vision-language</text>
<text x="475" y="86" text-anchor="middle" class="b">model backbone</text>
<text x="475" y="122" text-anchor="middle" class="m">already knows what a cabinet,</text>
<text x="475" y="145" text-anchor="middle" class="m">a handle and “open” mean</text>
<rect x="340" y="220" width="270" height="74" rx="10" fill="#FFF1D1" stroke="#C99A2E" stroke-width="2"/>
<text x="475.0" y="251.5" text-anchor="middle" class="b">Action expert</text>
<text x="475.0" y="274.5" text-anchor="middle" class="m">flow matching</text>
<line class="arrow" x1="475" y1="165" x2="475" y2="217"/>
<line class="arrow" x1="250" y1="65" x2="308" y2="65"/>
<line class="arrow" x1="250" y1="170" x2="308" y2="170"/>
<line class="arrow" x1="250" y1="275" x2="338" y2="275"/>
<rect x="700" y="222" width="220" height="70" rx="10" fill="#f6f8fa" stroke="#d4d9df" stroke-width="2"/>
<text x="810.0" y="251.5" text-anchor="middle" class="b">Action</text>
<text x="810.0" y="274.5" text-anchor="middle" class="m">a chunk of joint commands</text>
<line class="arrow" x1="610" y1="257" x2="698" y2="257"/>
<rect x="310" y="370" width="330" height="70" rx="10" fill="#ffffff" stroke="#d4d9df" stroke-width="2" stroke-dasharray="8 6"/>
<text x="475.0" y="399.5" text-anchor="middle" class="m">pre-trained on internet images and text,</text>
<text x="475.0" y="422.5" text-anchor="middle" class="m">then on lots of diverse robot data</text>
<line class="arrow" x1="475" y1="370" x2="475" y2="323"/>

</svg>
