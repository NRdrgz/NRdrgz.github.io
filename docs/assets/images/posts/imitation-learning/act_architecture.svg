<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-label="ACT architecture: images, joint positions and a style variable go through a transformer that outputs an action chunk">
<title>ACT architecture: images, joint positions and a style variable go through a transformer that outputs an action chunk</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
  </marker>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 19px; fill: #2E2E2E; }
    .b { font-weight: 600; }
    .m { fill: #5b6470; font-size: 16px; }
    .s { font-size: 15px; fill: #5b6470; }
    .arrow { stroke: #5b6470; stroke-width: 2; fill: none; marker-end: url(#arr); }
  </style>
</defs>
<rect width="940" height="520" fill="#ffffff"/>

<rect x="20" y="60" width="170" height="70" rx="10" fill="#f6f8fa" stroke="#d4d9df" stroke-width="2"/>
<text x="105.0" y="89.5" text-anchor="middle" class="b">Camera</text>
<text x="105.0" y="112.5" text-anchor="middle" class="b">images</text>
<rect x="240" y="60" width="160" height="70" rx="10" fill="#f6f8fa" stroke="#d4d9df" stroke-width="2"/>
<text x="320.0" y="89.5" text-anchor="middle" class="">ResNet</text>
<text x="320.0" y="112.5" text-anchor="middle" class="">backbone</text>
<rect x="20" y="185" width="170" height="60" rx="10" fill="#f6f8fa" stroke="#d4d9df" stroke-width="2"/>
<text x="105.0" y="221.0" text-anchor="middle" class="b">Joint positions</text>
<rect x="20" y="300" width="170" height="60" rx="10" fill="#FFF1D1" stroke="#C99A2E" stroke-width="2"/>
<text x="105.0" y="336.0" text-anchor="middle" class="b">Style z</text>
<rect x="450" y="60" width="150" height="300" rx="10" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<text x="525.0" y="204.5" text-anchor="middle" class="b">Transformer</text>
<text x="525.0" y="227.5" text-anchor="middle" class="b">encoder</text>
<rect x="650" y="60" width="150" height="300" rx="10" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<text x="725.0" y="204.5" text-anchor="middle" class="b">Transformer</text>
<text x="725.0" y="227.5" text-anchor="middle" class="b">decoder</text>
<rect x="850" y="96" width="70" height="30" rx="5" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<rect x="850" y="136" width="70" height="30" rx="5" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<rect x="850" y="176" width="70" height="30" rx="5" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<rect x="850" y="216" width="70" height="30" rx="5" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<rect x="850" y="256" width="70" height="30" rx="5" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<rect x="850" y="296" width="70" height="30" rx="5" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<text x="885" y="370" text-anchor="middle" class="b">Action</text>
<text x="885" y="393" text-anchor="middle" class="b">chunk</text>
<line class="arrow" x1="190" y1="95" x2="238" y2="95"/>
<line class="arrow" x1="400" y1="95" x2="448" y2="95"/>
<line class="arrow" x1="190" y1="215" x2="448" y2="215"/>
<line class="arrow" x1="190" y1="330" x2="448" y2="330"/>
<line class="arrow" x1="600" y1="210" x2="648" y2="210"/>
<line class="arrow" x1="800" y1="210" x2="846" y2="210"/>
<rect x="20" y="420" width="380" height="76" rx="10" fill="#ffffff" stroke="#C99A2E" stroke-width="2" stroke-dasharray="8 6"/>
<text x="210.0" y="452.5" text-anchor="middle" class="b">CVAE encoder (training only)</text>
<text x="210.0" y="475.5" text-anchor="middle" class="m">compresses the demo's actions into z</text>
<line class="arrow" x1="105" y1="420" x2="105" y2="363"/>
<text x="450" y="452" class="m">At test time there is no demo to encode,</text>
<text x="450" y="476" class="m">so z is simply set to 0 (the "average style").</text>

</svg>
