<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{{ "/favicon.svg" | relative_url }}">
    <link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relative_url }}">

    <!-- Fonts: Inter (body) + JetBrains Mono (code/metadata), loaded in one request -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

    <link rel="stylesheet" href="{{ "/assets/css/theme.css" | relative_url }}">

    <!-- SEO: title, description, canonical, Open Graph & Twitter card text -->
    {% seo %}
    <!-- RSS feed discovery -->
    {% feed_meta %}
    <!-- Social share image (posts define hero_image / thumbnail) -->
    {% assign og_image = page.hero_image | default: page.thumbnail %}
    {% if og_image %}
    <meta property="og:image" content="{{ og_image | absolute_url }}" />
    <meta name="twitter:image" content="{{ og_image | absolute_url }}" />
    {% endif %}

    <!-- MathJax -->
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    {% if page.layout == "post" %}
    <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
    {% endif %}

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ "/" | relative_url }}" aria-label="Home">
          <span class="brand-mark" aria-hidden="true">N</span>
        </a>
        <nav class="nav nav-right" aria-label="Primary">
          <a href="{{ "/" | relative_url }}">Home</a>
          <a href="{{ "/about/" | relative_url }}">About</a>
        </nav>
      </div>
    </header>

    <main class="site-main container" id="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© {{ site.time | date: "%Y" }} {{ site.author | default: "Nico" }}</p>
        <span class="footer-meta">
          <a href="https://github.com/{{ site.github_username }}">github</a> ·
          <a href="{{ "/feed.xml" | relative_url }}">rss</a>
        </span>
      </div>
    </footer>

    <script>
      (function () {
        // Reading progress (post pages only)
        var bar = document.getElementById('reading-progress');
        if (bar) {
          var ticking = false;
          function updateProgress() {
            var doc = document.documentElement;
            var scrollable = doc.scrollHeight - doc.clientHeight;
            var ratio = scrollable > 0 ? (doc.scrollTop || document.body.scrollTop) / scrollable : 0;
            if (ratio < 0) ratio = 0; if (ratio > 1) ratio = 1;
            bar.style.transform = 'scaleX(' + ratio + ')';
            ticking = false;
          }
          function onScroll() {
            if (!ticking) { window.requestAnimationFrame(updateProgress); ticking = true; }
          }
          window.addEventListener('scroll', onScroll, { passive: true });
          window.addEventListener('resize', updateProgress);
          updateProgress();
        }
      })();
    </script>

    <script>
      // Ensure MathJax processes the page after content loads
      window.addEventListener('load', function() {
        if (window.MathJax && window.MathJax.typesetPromise) {
          MathJax.typesetPromise();
        }
      });
    </script>
  </body>
</html>
