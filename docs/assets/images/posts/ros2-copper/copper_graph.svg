<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-label="A copper-rs application: four tasks in one binary run in a fixed order, sharing a preallocated CopperList that is logged and can be replayed exactly">
<title>A copper-rs application: four tasks in one binary run in a fixed order, sharing a preallocated CopperList that is logged and can be replayed exactly</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
  </marker>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 19px; fill: #2E2E2E; }
    .b { font-weight: 600; }
    .m { fill: #5b6470; font-size: 16px; }
    .s { font-size: 15px; fill: #5b6470; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 17px; }
    .arrow { stroke: #5b6470; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .dash { stroke: #5b6470; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  </style>
</defs>
<rect width="960" height="450" fill="#ffffff"/>
<rect x="20" y="20" width="920" height="276" rx="14" fill="none" stroke="#d4d9df" stroke-width="2" stroke-dasharray="8 6"/>
<text x="40" y="50" class="b">One binary, one process</text>
<text x="135" y="86" text-anchor="middle" class="s">source</text>
<rect x="50" y="96" width="170" height="56" rx="10" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<text x="135.0" y="130.0" text-anchor="middle" class="b">imu</text>
<circle cx="50" cy="96" r="14" fill="#FFC857" stroke="#C99A2E" stroke-width="2"/>
<text x="50" y="102" text-anchor="middle" class="b" style="font-size:16px">1</text>
<line class="arrow" x1="220" y1="124" x2="278" y2="124"/>
<text x="365" y="86" text-anchor="middle" class="s">task</text>
<rect x="280" y="96" width="170" height="56" rx="10" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<text x="365.0" y="130.0" text-anchor="middle" class="b">filter</text>
<circle cx="280" cy="96" r="14" fill="#FFC857" stroke="#C99A2E" stroke-width="2"/>
<text x="280" y="102" text-anchor="middle" class="b" style="font-size:16px">2</text>
<line class="arrow" x1="450" y1="124" x2="508" y2="124"/>
<text x="595" y="86" text-anchor="middle" class="s">task</text>
<rect x="510" y="96" width="170" height="56" rx="10" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<text x="595.0" y="130.0" text-anchor="middle" class="b">controller</text>
<circle cx="510" cy="96" r="14" fill="#FFC857" stroke="#C99A2E" stroke-width="2"/>
<text x="510" y="102" text-anchor="middle" class="b" style="font-size:16px">3</text>
<line class="arrow" x1="680" y1="124" x2="738" y2="124"/>
<text x="825" y="86" text-anchor="middle" class="s">sink</text>
<rect x="740" y="96" width="170" height="56" rx="10" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<text x="825.0" y="130.0" text-anchor="middle" class="b">motors</text>
<circle cx="740" cy="96" r="14" fill="#FFC857" stroke="#C99A2E" stroke-width="2"/>
<text x="740" y="102" text-anchor="middle" class="b" style="font-size:16px">4</text>
<rect x="30" y="196" width="900" height="84" rx="10" fill="#f6f8fa" stroke="#d4d9df" stroke-width="2"/>
<text x="812" y="222" text-anchor="middle" class="b">CopperList</text>
<text x="812" y="246" text-anchor="middle" class="s">preallocated,</text>
<text x="812" y="266" text-anchor="middle" class="s">reused every cycle</text>
<rect x="40" y="218" width="190" height="40" rx="6" fill="#ffffff" stroke="#355C7D" stroke-width="2"/>
<text x="135" y="244" text-anchor="middle" class="mono">ImuReading</text>
<rect x="270" y="218" width="190" height="40" rx="6" fill="#ffffff" stroke="#355C7D" stroke-width="2"/>
<text x="365" y="244" text-anchor="middle" class="mono">Orientation</text>
<rect x="500" y="218" width="190" height="40" rx="6" fill="#ffffff" stroke="#355C7D" stroke-width="2"/>
<text x="595" y="244" text-anchor="middle" class="mono">WheelSpeeds</text>
<line class="dash" x1="135" y1="152" x2="135" y2="216"/>
<line class="dash" x1="365" y1="152" x2="365" y2="216"/>
<line class="dash" x1="595" y1="152" x2="595" y2="216"/>
<text x="920" y="50" text-anchor="end" class="s">order fixed at compile time: 1 → 2 → 3 → 4</text>
<line class="arrow" x1="480" y1="280" x2="480" y2="368"/>
<rect x="370" y="370" width="220" height="60" rx="10" fill="#FFF1D1" stroke="#C99A2E" stroke-width="2"/>
<text x="480.0" y="395.0" text-anchor="middle" class="b">unified log</text>
<text x="480.0" y="417.0" text-anchor="middle" class="m">every cycle, recorded</text>
<line class="arrow" x1="590" y1="400" x2="668" y2="400"/>
<rect x="670" y="370" width="240" height="60" rx="10" fill="#FFF1D1" stroke="#C99A2E" stroke-width="2"/>
<text x="790.0" y="395.0" text-anchor="middle" class="b">resimulation</text>
<text x="790.0" y="417.0" text-anchor="middle" class="m">same inputs, same outputs</text>
</svg>
