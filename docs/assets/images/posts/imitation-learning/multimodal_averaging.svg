<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Averaging two valid demonstrations leads straight into the obstacle">
<title>Averaging two valid demonstrations leads straight into the obstacle</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
  </marker>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 19px; fill: #2E2E2E; }
    .b { font-weight: 600; }
    .m { fill: #5b6470; font-size: 16px; }
    .s { font-size: 15px; fill: #5b6470; }
    .arrow { stroke: #5b6470; stroke-width: 2; fill: none; marker-end: url(#arr); }
  </style>
</defs>
<rect width="800" height="520" fill="#ffffff"/>

<circle cx="400" cy="400" r="9" fill="#2E2E2E"/>
<text x="400" y="438" text-anchor="middle" class="m">start</text>
<path d="M392,78 l8,-18 l8,18 z" fill="#FFC857" stroke="#C99A2E" stroke-width="2"/>
<text x="400" y="42" text-anchor="middle" class="m">goal: the handle</text>
<circle cx="400" cy="225" r="46" fill="#7FA77A" stroke="#5d8458" stroke-width="2"/>
<text x="400" y="232" text-anchor="middle" class="b" style="fill:#ffffff">obstacle</text>
<path d="M400,390 C250,330 250,130 400,80" stroke="#355C7D" stroke-width="4" fill="none"/>
<path d="M400,390 C550,330 550,130 400,80" stroke="#355C7D" stroke-width="4" fill="none"/>
<text x="275" y="232" text-anchor="end">Demo 1</text>
<text x="275" y="255" text-anchor="end" class="m">goes left</text>
<text x="525" y="232">Demo 2</text>
<text x="525" y="255" class="m">goes right</text>
<line x1="400" y1="390" x2="400" y2="290" stroke="#C2410C" stroke-width="4" stroke-dasharray="9 7"/>
<g stroke="#C2410C" stroke-width="4" stroke-linecap="round">
  <line x1="388" y1="270" x2="412" y2="294"/><line x1="412" y1="270" x2="388" y2="294"/>
</g>
<line x1="120" y1="490" x2="160" y2="490" stroke="#355C7D" stroke-width="4"/>
<text x="172" y="496">Demonstrations (both correct)</text>
<line x1="480" y1="490" x2="520" y2="490" stroke="#C2410C" stroke-width="4" stroke-dasharray="9 7"/>
<text x="532" y="496">Their average (a crash)</text>

</svg>
