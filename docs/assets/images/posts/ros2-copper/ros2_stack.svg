<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 446" role="img" aria-label="The ROS2 stack: your node, client libraries, rcl, rmw, then DDS or Zenoh over the network">
<title>The ROS2 stack: your node, client libraries, rcl, rmw, then DDS or Zenoh over the network</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
  </marker>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 19px; fill: #2E2E2E; }
    .b { font-weight: 600; }
    .m { fill: #5b6470; font-size: 16px; }
    .s { font-size: 15px; fill: #5b6470; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 17px; }
    .arrow { stroke: #5b6470; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .dash { stroke: #5b6470; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  </style>
</defs>
<rect width="680" height="446" fill="#ffffff"/>
<rect x="20" y="20" width="440" height="56" rx="10" fill="#FFF1D1" stroke="#C99A2E" stroke-width="2"/>
<text x="240.0" y="43.0" text-anchor="middle" class="b">Your node</text>
<text x="240.0" y="65.0" text-anchor="middle" class="m">the code you write</text>
<rect x="20" y="90" width="440" height="56" rx="10" fill="#f6f8fa" stroke="#d4d9df" stroke-width="2"/>
<text x="240.0" y="113.0" text-anchor="middle" class="b">rclcpp / rclpy</text>
<text x="240.0" y="135.0" text-anchor="middle" class="m">client libraries for C++ and Python</text>
<rect x="20" y="160" width="440" height="56" rx="10" fill="#f6f8fa" stroke="#d4d9df" stroke-width="2"/>
<text x="240.0" y="183.0" text-anchor="middle" class="b">rcl</text>
<text x="240.0" y="205.0" text-anchor="middle" class="m">shared core, written in C</text>
<rect x="20" y="230" width="440" height="56" rx="10" fill="#f6f8fa" stroke="#d4d9df" stroke-width="2"/>
<text x="240.0" y="253.0" text-anchor="middle" class="b">rmw</text>
<text x="240.0" y="275.0" text-anchor="middle" class="m">ROS middleware interface</text>
<rect x="20" y="300" width="440" height="56" rx="10" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<text x="240.0" y="323.0" text-anchor="middle" class="b">DDS or Zenoh</text>
<text x="240.0" y="345.0" text-anchor="middle" class="m">Fast DDS, Cyclone DDS, Zenoh...</text>
<rect x="20" y="370" width="440" height="56" rx="10" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
<text x="240.0" y="393.0" text-anchor="middle" class="b">Transport</text>
<text x="240.0" y="415.0" text-anchor="middle" class="m">UDP across machines, shared memory locally</text>
<path d="M480,300 h14 v126 h-14" stroke="#355C7D" stroke-width="2" fill="none"/>
<text x="508" y="342" class="m" style="fill:#2E2E2E">discovery,</text>
<text x="508" y="366" class="m" style="fill:#2E2E2E">QoS contracts,</text>
<text x="508" y="390" class="m" style="fill:#2E2E2E">serialization</text>

</svg>
