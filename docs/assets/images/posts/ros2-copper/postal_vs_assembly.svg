<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-label="ROS2 works like a postal service where delivery order can change between runs, while Copper works like an assembly line where tasks fill the same tray in a fixed order">
<title>ROS2 works like a postal service where delivery order can change between runs, while Copper works like an assembly line where tasks fill the same tray in a fixed order</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
  </marker>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 19px; fill: #2E2E2E; }
    .b { font-weight: 600; }
    .m { fill: #5b6470; font-size: 16px; }
    .s { font-size: 15px; fill: #5b6470; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 17px; }
    .arrow { stroke: #5b6470; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .dash { stroke: #5b6470; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  </style>
</defs>
<rect width="960" height="580" fill="#ffffff"/>

<text x="20" y="40" class="b">ROS2: a postal service</text>
<text x="20" y="66" class="m">each node mails its messages, the post office decides when they arrive</text>
<rect x="40" y="100" width="150" height="50" rx="25" fill="rgba(53,92,125,0.10)" stroke="#355C7D" stroke-width="2"/>
